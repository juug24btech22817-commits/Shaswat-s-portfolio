
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaswat | AI Engineer & Full Stack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0D0F12; /* Cyber-Onyx Professional */
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      /* Carbon Fiber & Depth Overlays */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        opacity: 0.04;
        z-index: 1;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.5) 100%);
        z-index: 2;
        pointer-events: none;
      }

      h1, h2, h3, h4, .font-heading {
        font-family: 'Outfit', sans-serif;
        letter-spacing: -0.02em;
      }
      canvas {
        display: block;
      }
      ::selection {
        background: #00f2ff;
        color: #000;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0D0F12;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f2ff;
      }
      section {
        position: relative;
        scroll-margin-top: 100px;
        z-index: 10;
      }

      /* Professional Scanning Animation */
      @keyframes full-scan-pro {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 0.4; }
        90% { opacity: 0.4; }
        100% { top: 100%; opacity: 0; }
      }

      .ui-scan-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(0, 242, 255, 0.5), transparent);
        box-shadow: 0 0 12px rgba(0, 242, 255, 0.3);
        z-index: 20;
        pointer-events: none;
        animation: full-scan-pro 6s ease-in-out infinite;
      }

      .ui-scan-overlay {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 242, 255, 0.015) 0px,
          rgba(0, 242, 255, 0.015) 1px,
          transparent 1px,
          transparent 4px
        );
        pointer-events: none;
        z-index: 5;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",

    "three": "https://esm.sh/three@^0.182.0",
    "gsap/": "https://esm.sh/gsap@^3.14.2/",
    "gsap": "https://esm.sh/gsap@^3.14.2",
    "gsap/ScrollToPlugin": "https://esm.sh/gsap/ScrollToPlugin",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
  }
}
</script>

</head>
